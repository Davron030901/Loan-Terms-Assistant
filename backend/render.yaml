services:
  - type: web
    name: loan-terms-api
    runtime: python
    region: frankfurt          # choose the region nearest your Qdrant Cloud cluster
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── secrets: set these in the Render dashboard, never in git ──────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app,http://localhost:3000
      # ── safe defaults ────────────────────────────────────────────────────
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: EMBED_DIM
        value: "768"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: AUTO_INGEST
        value: "false"       # ingest locally against the same cluster instead
